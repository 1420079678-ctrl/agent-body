# dsh-agent-teams-pro bundle patch: mounts the AgentTeams Pro (Deep Research
# Edition) plugin into the host composition of a dsh profile. The plugin
# registers its `agent_teams_*` tools plus the DeerFlow deep-research tools
# (`deerflow_plan`, `deerflow_members`) into the shared `tools` registry and one
# usage section into the global system prompt, so every session of the profile
# can launch a DeerFlow-style deep-research team through natural language
# ("用 AgentTeams Pro 深度研究一下 X").
#
# Install: `dsh plugin --profile <name> add <this package>` (npm or a local
# path). The `dsh plugin` command pnpm-installs the package into the profile
# and reconciles it into the profile's `dsh.profile.bundles` layer list.
- insert:
    - id: agent-teams-pro
      name: dsh-agent-teams-pro
      config:
        # Team state lives under `<session workspace>/<stateDir>/<teamId>/`
        # (team.json + inbox/*.jsonl mailboxes).
        stateDir: .agent-teams
        # Provider used to spawn member subagents ('spawn' or 'fork').
        memberProvider: spawn
