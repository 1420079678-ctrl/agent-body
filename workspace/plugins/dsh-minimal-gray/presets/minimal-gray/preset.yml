# 极简灰度版（Minimal Gray）— Agent 预设元数据。
#
# 抖音「用这段提示词，彻底解锁 deepseek」图文的核心技术：以 DSH 极简模式为底，
# 用「平台自适应 Shell」对抗 Windows 不适配 Bash 的问题，并精选文件、搜索、
# 网页、待办、后台任务、技能与目标等模式常用工具的最小组合。
# 本预设由 @dsh-external/dsh-minimal-gray 插件安装到 <DSH_HOME>/.agent-presets/，
# 发现是热加载的——写入即出现在预设选择器，无需重启。

name: 极简灰度版
description: 以极简模式为底，平台自适应 Shell（Windows→PowerShell，Unix→Bash），精选文件/搜索/网页/待办/后台任务/技能/目标工具的最小组合。
order: 4
